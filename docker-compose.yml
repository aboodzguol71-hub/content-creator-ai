version: '3.9'

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    image: python:3.11
    working_dir: /app
    volumes:
      - .:/app
    command: bash -lc "pip install -r backend/requirements.txt && uvicorn backend.app:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      - ollama

volumes:
  ollama_data:
